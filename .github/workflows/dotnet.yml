name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Publish Native AOT
      run: dotnet publish sysfetch -c Release -o out

    - name: Smoke test
      run: |
        ./out/sysfetch --version
        ./out/sysfetch --no-color --no-config
        ./out/sysfetch --json --no-config > sysfetch.json
        cat sysfetch.json
        python3 -c "import json,sys; d=json.load(open('sysfetch.json')); assert d['os'], 'os missing'; assert d['kernel'], 'kernel missing'" \
          || python -c "import json,sys; d=json.load(open('sysfetch.json')); assert d['os'], 'os missing'; assert d['kernel'], 'kernel missing'"

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: sysfetch-${{ runner.os }}-${{ runner.arch }}
        path: |
          out/sysfetch
          out/sysfetch.exe
        if-no-files-found: error
        retention-days: 14
